name: Aerthys
options:
  bundleIdPrefix: com.example.aerthys
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  Aerthys:
    type: application
    platform: iOS
    sources:
      - path: Aerthys
    settings:
      base:
        PRODUCT_NAME: Aerthys
        PRODUCT_BUNDLE_IDENTIFIER: com.example.aerthys
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Aerthys
        INFOPLIST_KEY_NSCameraUsageDescription: "Aerthys necesita acceder a la cámara para analizar visualmente el líquen."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  AerthysTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AerthysTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.aerthys.tests
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Aerthys.app/Aerthys"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Aerthys
schemes:
  Aerthys:
    build:
      targets:
        Aerthys: all
        AerthysTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AerthysTests
